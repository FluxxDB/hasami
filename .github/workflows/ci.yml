name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The pinned ffmpeg archive is ~250 MB; keep the extracted binaries between runs.
      - uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: ffmpeg-${{ hashFiles('scripts/fetch-ffmpeg.ps1') }}

      - name: Fetch ffmpeg
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1

      - run: npm ci
      - run: npm test
      - run: npm run check

      - name: cargo test
        working-directory: src-tauri
        run: cargo test
