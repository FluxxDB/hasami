[package]
name = "hasami"
version = "0.1.0"
description = "Right-click video trim, compress and convert for Windows"
edition = "2021"
rust-version = "1.89"
default-run = "hasami"

[lib]
name = "hasami_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "hasami"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
winreg = "0.56"
trash = "5"

[dev-dependencies]
tempfile = "3"
